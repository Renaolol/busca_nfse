name: Publish Windows Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'jest.config.ts'
      - 'README.md'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'src/**'
      - 'frontend/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        continue-on-error: true

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build release package
        id: package
        shell: pwsh
        run: |
          $packageJson = Get-Content -Path package.json -Raw | ConvertFrom-Json
          $version = [string]$packageJson.version

          .\deploy\windows\build-release-package.ps1 -SkipBuild -Force

          $hashInfo = Get-Content -Path "releases/notasync-$version-windows.hash.json" -Raw | ConvertFrom-Json
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "package_file=releases/notasync-$version-windows.zip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$($hashInfo.sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_bytes=$($hashInfo.sizeBytes)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "published_at=$publishedAt"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          files: ${{ steps.package.outputs.package_file }}
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable manifest
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/notasync-$version-windows.zip"

          node scripts/generate-release-manifest.js `
            --channel stable `
            --version $version `
            --published-at "${{ steps.package.outputs.published_at }}" `
            --win-package-url $packageUrl `
            --win-package-sha256 "${{ steps.package.outputs.sha256 }}" `
            --win-package-size "${{ steps.package.outputs.size_bytes }}" `
            --out updates/stable/manifest.json

      - name: Commit stable manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/stable/manifest.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Manifesto ja estava atualizado."
            exit 0
          }

          git commit -m "chore: publish stable manifest for v${{ steps.package.outputs.version }}"
          git push origin HEAD:main
